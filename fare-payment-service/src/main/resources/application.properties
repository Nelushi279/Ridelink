spring.application.name=fare-payment-service
server.port=8084
spring.data.mongodb.uri=${FARE_PAYMENT_MONGODB_URI:mongodb://localhost:27017/ridelink_fare_payment}

# Fare rule: total = max(base-fare + distanceKm * per-km-rate + durationMinutes * per-minute-rate, minimum-fare)
ridelink.fare.currency=LKR
ridelink.fare.base-fare=150.00
ridelink.fare.per-km-rate=80.00
ridelink.fare.per-minute-rate=5.00
ridelink.fare.minimum-fare=250.00
